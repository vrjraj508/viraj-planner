<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d1117">
<title>SB Interview Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.hdr{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#161b22;border-bottom:1px solid #21262d;height:54px}
.hdr-title{font-size:14px;font-weight:700;white-space:nowrap;flex-shrink:0}
.hdr-search{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:7px 12px;color:#e6edf3;font-size:13px;outline:none;min-width:0}
.hdr-search::placeholder{color:#484f58}
.hdr-search:focus{border-color:#58a6ff}
#app{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 0 6px}
#app::-webkit-scrollbar{width:0}
.nav{flex-shrink:0;display:flex;background:#161b22;border-top:1px solid #21262d;height:58px;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;background:none;border:none;color:#484f58;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0;transition:color .15s;font-family:inherit}
.nav-btn .ic{font-size:19px;line-height:1}
.nav-btn.active{color:#58a6ff}
.nav-btn:active{opacity:.6}
/* Sections */
.sec{margin:0 10px 7px}
.sec-hdr{display:flex;align-items:center;gap:8px;padding:11px 13px;background:#161b22;border:1px solid #21262d;border-radius:10px;cursor:pointer;user-select:none;transition:border-color .15s}
.sec-hdr.open{border-radius:10px 10px 0 0;border-bottom-color:transparent}
.sec-hdr:active{border-color:#58a6ff}
.sec-em{font-size:17px;flex-shrink:0}
.sec-info{flex:1;min-width:0}
.sec-title{font-size:13.5px;font-weight:600;color:#e6edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-sub{font-size:10.5px;color:#8b949e;margin-top:1px}
.sec-arr{color:#484f58;font-size:11px;transition:transform .2s;flex-shrink:0}
.sec-hdr.open .sec-arr{transform:rotate(90deg)}
.sec-prog{display:flex;align-items:center;gap:5px;margin-top:4px}
.pb{flex:1;height:3px;background:#21262d;border-radius:2px;overflow:hidden}
.pf{height:100%;background:#58a6ff;border-radius:2px;transition:width .3s}
.pt{font-size:9.5px;color:#8b949e;white-space:nowrap;flex-shrink:0}
.sec-body{display:none;background:#161b22;border:1px solid #21262d;border-top:none;border-radius:0 0 10px 10px}
.sec-body.open{display:block}
/* Modules */
.mod{border-bottom:1px solid #21262d}
.mod:last-child{border-bottom:none}
.mod-hdr{display:flex;align-items:center;gap:8px;padding:9px 13px;cursor:pointer;user-select:none}
.mod-hdr:active{background:#1c2129}
.mod-title{flex:1;font-size:12.5px;font-weight:500;color:#c9d1d9}
.mod-cnt{font-size:10px;color:#484f58;white-space:nowrap}
.mod-arr{color:#484f58;font-size:10px;transition:transform .2s}
.mod-hdr.open .mod-arr{transform:rotate(90deg)}
.mod-items{display:none}
.mod-items.open{display:block}
/* Items */
.item{display:flex;align-items:center;gap:9px;padding:8px 13px 8px 26px;cursor:pointer;transition:background .1s}
.item:active{background:#1c2129}
.chk{width:17px;height:17px;border:2px solid #30363d;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;transition:all .15s}
.chk.done{background:#238636;border-color:#238636;color:#fff}
.item-t{flex:1;font-size:12px;color:#8b949e;min-width:0;line-height:1.45;cursor:pointer}
.item-t:hover{color:#c9d1d9}
.item.done .item-t{color:#30363d;text-decoration:line-through}
.sc-txt{cursor:pointer}
.sc-txt:hover{color:#c9d1d9}
.chk{cursor:pointer}
.cpy{flex-shrink:0;background:none;border:none;color:#21262d;font-size:14px;cursor:pointer;padding:4px 3px;border-radius:4px;line-height:1;transition:color .15s}
.cpy:active,.item:hover .cpy{color:#58a6ff}
.bk{flex-shrink:0;background:none;border:none;color:#21262d;font-size:13px;cursor:pointer;padding:4px 3px;border-radius:4px;line-height:1;transition:color .15s}
.bk:active,.item:hover .bk,.bk.on{color:#f0883e}
/* Badges */
.bdg{flex-shrink:0;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px}
.e{background:#0d2e1e;color:#3fb950}
.m{background:#2d2003;color:#d29922}
.h{background:#2d1116;color:#f85149}
/* DSA filter chips */
.chips{display:flex;gap:5px;padding:0 10px 9px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:#21262d;border:1px solid #30363d;border-radius:14px;color:#8b949e;font-size:11.5px;padding:4px 11px;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.chip.on{background:#1a2d4a;border-color:#58a6ff;color:#58a6ff}
.chip:active{opacity:.7}
.dsa-cat{padding:2px 13px 2px 28px;font-size:10px;font-weight:700;color:#30363d;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
/* Scenario items */
.sc-item{display:flex;align-items:flex-start;gap:8px;padding:9px 13px 9px 26px;border-bottom:1px solid #21262d;cursor:pointer;transition:background .1s}
.sc-item:last-child{border-bottom:none}
.sc-item:active{background:#1c2129}
.sc-item.done .sc-txt{color:#30363d;text-decoration:line-through}
.sc-num{font-size:10px;color:#484f58;flex-shrink:0;padding-top:2px;min-width:20px}
.sc-txt{flex:1;font-size:12px;color:#8b949e;line-height:1.5}
.sc-actions{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
/* Saved */
.sav-sec{padding:0 10px;margin-bottom:14px}
.sav-lbl{font-size:10px;color:#484f58;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;padding:0 2px}
.sav-item{display:flex;align-items:center;gap:9px;padding:10px 11px;background:#161b22;border:1px solid #21262d;border-radius:8px;margin-bottom:5px;cursor:pointer;transition:border-color .15s}
.sav-item:active{border-color:#58a6ff}
.sav-t{flex:1;font-size:12.5px;color:#c9d1d9;line-height:1.4}
.sav-tag{font-size:9px;color:#484f58;background:#21262d;padding:2px 5px;border-radius:3px;flex-shrink:0}
.empty{text-align:center;padding:36px 20px;color:#484f58;font-size:13px;line-height:1.6}
/* Stats */
.stat-card{margin:0 10px 9px;background:#161b22;border:1px solid #21262d;border-radius:10px;padding:13px}
.stat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.stat-lbl{font-size:12px;color:#8b949e}
.stat-val{font-size:13px;font-weight:600;color:#e6edf3}
.stat-big{font-size:30px;font-weight:700;color:#58a6ff;line-height:1}
.stat-sub{font-size:11px;color:#8b949e;margin-top:3px}
.prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.prow-t{font-size:11.5px;color:#c9d1d9}
.prow-p{font-size:11px;color:#8b949e}
.prow-b{flex:1;height:4px;background:#21262d;border-radius:2px;overflow:hidden;margin:0 8px}
.prow-f{height:100%;border-radius:2px}
/* Overlay + sheet */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:flex-end}
#overlay.show{display:flex;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
#sheet{width:100%;max-width:600px;margin:0 auto;background:#161b22;border-radius:14px 14px 0 0;border:1px solid #30363d;border-bottom:none;padding-bottom:env(safe-area-inset-bottom,8px);animation:su .2s ease-out;max-height:85vh;overflow-y:auto}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh-handle{width:36px;height:4px;background:#30363d;border-radius:2px;margin:11px auto 0}
.sh-top{padding:12px 14px 10px;border-bottom:1px solid #21262d}
.sh-topic{font-size:13px;font-weight:600;color:#e6edf3;line-height:1.4}
.sh-sub{font-size:10.5px;color:#484f58;margin-top:3px}
.pmt-btn{display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;background:none;border:none;border-bottom:1px solid #21262d;color:#e6edf3;text-align:left;cursor:pointer;transition:background .1s;font-family:inherit}
.pmt-btn:last-child{border-bottom:none}
.pmt-btn:active{background:#21262d}
.pmt-ic{font-size:19px;width:26px;text-align:center;flex-shrink:0}
.pmt-lbl{font-size:13.5px;font-weight:500}
.pmt-dsc{font-size:10.5px;color:#8b949e;margin-top:1px}
.sh-cancel{display:block;width:calc(100%-20px);margin:8px 10px 10px;padding:13px;background:#21262d;border:none;border-radius:9px;color:#e6edf3;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.sh-cancel:active{background:#30363d}
/* Toast */
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;font-size:12.5px;padding:7px 15px;border-radius:18px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;z-index:200}
#toast.show{opacity:1}
/* Search results */
.sr{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid #21262d;cursor:pointer}
.sr:active{background:#161b22}
.sr-tag{font-size:9px;color:#8b949e;background:#21262d;padding:2px 6px;border-radius:4px;flex-shrink:0;white-space:nowrap}
.sr-t{flex:1;font-size:12.5px;color:#c9d1d9;line-height:1.4}
.no-r{padding:36px;text-align:center;color:#484f58;font-size:13px}
@media(min-width:600px){.sec,.sav-sec,.stat-card{margin-left:14px;margin-right:14px}}
</style>
</head>
<body>
<header class="hdr">
  <span class="hdr-title">☕ SB Tracker</span>
  <input class="hdr-search" type="search" id="si" placeholder="Search..." autocomplete="off" spellcheck="false">
</header>
<main id="app"></main>
<nav class="nav" id="nav">
  <button class="nav-btn active" data-t="path" onclick="A.tab('path')"><span class="ic">🗺️</span>Path</button>
  <button class="nav-btn" data-t="dsa" onclick="A.tab('dsa')"><span class="ic">⚡</span>DSA</button>
  <button class="nav-btn" data-t="sc" onclick="A.tab('sc')"><span class="ic">🔥</span>Scenarios</button>
  <button class="nav-btn" data-t="saved" onclick="A.tab('saved')"><span class="ic">🔖</span>Saved</button>
  <button class="nav-btn" data-t="stats" onclick="A.tab('stats')"><span class="ic">📊</span>Stats</button>
</nav>
<div id="overlay" onclick="A.closeSheet(event)">
  <div id="sheet">
    <div class="sh-handle"></div>
    <div class="sh-top"><div class="sh-topic" id="shT"></div><div class="sh-sub" id="shS"></div></div>
    <div id="shP"></div>
    <button class="sh-cancel" onclick="A.closeSheet()">Cancel</button>
  </div>
</div>
<div id="toast">✓ Copied!</div>
<script>
// ============================================================
// PROMPTS
// ============================================================
const PMTS=[
  {e:'📖',l:'Deep Article',d:'Theory + 20–40 Interview Q&A',
   t:'I am preparing for a Java/Spring Boot backend developer interview targeting 2–5 years of experience in India. Topic: {{T}}. Create a comprehensive article: divide into subtopics, explain each in 3–8 detailed paragraphs from ground up to advanced, include interview statements I can use verbatim, explain process workflows in 5–20 bullet points, then provide 20–40 interview Q&A with detailed 1-paragraph answers per question. Use emojis to organize. No diagrams. No duplication. Keep each section isolated and self-contained.'},
  {e:'💻',l:'Hands-On Programs',d:'30–50 enterprise programs + Spring Boot project',
   t:'I am preparing for a Java/Spring Boot backend developer interview targeting 2–5 years of experience. Topic: {{T}}. Create enterprise-grade hands-on programs: explain subtopics and all concepts in 3–8 paragraphs, then generate 30–50 programs covering basic to advanced patterns with zero comments in code, explain program workflow in bullet points after each. Then combine concepts into 20 complex enterprise programs. Include a complete Spring Boot REST API project using this topic. End with 20–40 interview questions with detailed paragraph answers. No System.out.println explanations — explain before the code.'},
  {e:'🏗️',l:'System Design',d:'LLD + HLD + trade-offs',
   t:'I am preparing for a Java/Spring Boot backend developer interview. Topic: {{T}}. Create a complete system design article covering both LLD and HLD. Divide into subtopics, explain each from ground up in 3–8 paragraphs, include interview statements, process workflow bullet points, then 20–40 Q&A with scenario-based and counter questions answered in 1 detailed paragraph each. Focus on design decisions, trade-offs, failure modes, and production patterns.'},
  {e:'🎯',l:'Scenario Q&A',d:'Symptom → Fix → Prevention + 10–15 follow-up',
   t:'I am preparing for a Java/Spring Boot backend developer interview. Scenario: {{T}}. Answer using the framework: Symptom → Hypothesis → Verification → Fix → Prevention. Explain the root cause in depth, show what exactly breaks internally, give the corrected code, and explain how to prevent it in production. Then give me 10–15 follow-up counter questions with detailed answers an interviewer might ask after this scenario.'},
  {e:'🏷️',l:'Annotations & Concepts',d:'All options + complete enterprise project',
   t:'I am preparing for a Java/Spring Boot backend developer interview. Topic: {{T}}. Create a complete annotation/concept tutorial: start from ground up in 3–8 paragraphs, then explain every option/attribute with 5–10 bullet points and code snippets per option. Build a complete enterprise-grade Spring Boot REST API that uses this annotation/concept extensively. End with 20–40 Q&A with detailed paragraph answers.'},
  {e:'⚡',l:'Quick Copy',d:'Just the topic name',
   t:'{{T}}'}

// PATH DATA

const PATH=[
{id:'p1',e:'☕',t:'Phase 1 — Core Java Mastery',sub:'Days 1–18 | MANDATORY',c:'#58a6ff',
 mods:[
  {id:'p1m0',t:'1A — JVM Architecture & Memory Model',items:[

    'ClassLoader subsystem — Bootstrap, Extension, Application ClassLoader',
    'ClassLoader delegation model — parent-first delegation',
    'Class loading phases — Loading → Linking → Initialization',

    'Escape analysis — stack vs heap allocation optimization',
    'GC roots — what qualifies as a GC root',
    'Mark-and-sweep algorithm — phases and fragmentation',
    'Minor GC vs Major GC vs Full GC — triggers and differences',
    'Stop-the-world pauses — why they happen and impact',
    'G1 GC — regions, concurrent marking, mixed collections',
    'ZGC — concurrent relocation, colored pointers, sub-ms pauses',

    'Object equality — == vs .equals() vs .compareTo()',
    'hashCode and equals contract — if equal then same hash (not vice versa)',

  {id:'p1m2',t:'1C — Collections Framework Internals',items:[
    'ArrayList — dynamic array, resizing factor 1.5x, O(1) amortized add',
    'LinkedList — doubly linked, O(1) add/remove at ends, O(n) random access',

// ============================================================
// APP STATE & LOGIC
// ============================================================
const A={
  tab_:'path',
  done:new Set(),
  bk:new Set(),
  openS:new Set(),
  openM:new Set(),
  dsaFilter:'all',
  curSheet:null,

  init(){
    try{
      const d=localStorage.getItem('sb_done');if(d)this.done=new Set(JSON.parse(d));
      const b=localStorage.getItem('sb_bk');if(b)this.bk=new Set(JSON.parse(b));
      const os=localStorage.getItem('sb_os');if(os)this.openS=new Set(JSON.parse(os));
      const om=localStorage.getItem('sb_om');if(om)this.openM=new Set(JSON.parse(om));
    }catch(e){}
    document.getElementById('si').addEventListener('input',e=>this.search(e.target.value));
    document.addEventListener('keydown',e=>{if(e.key==='Escape')this.closeSheet();});
    this.render();
  },

  save(){
    try{
      localStorage.setItem('sb_done',JSON.stringify([...this.done]));
      localStorage.setItem('sb_bk',JSON.stringify([...this.bk]));
      localStorage.setItem('sb_os',JSON.stringify([...this.openS]));
      localStorage.setItem('sb_om',JSON.stringify([...this.openM]));
    }catch(e){}
  },

  tab(t){
    this.tab_=t;
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
    document.getElementById('si').value='';
    const app=document.getElementById('app');
    app.scrollTop=0;
    this.render();
  },

  render(){
    const app=document.getElementById('app');
    if(this.tab_==='path') app.innerHTML=this.renderPath();
    else if(this.tab_==='dsa') app.innerHTML=this.renderDsa();
    else if(this.tab_==='sc') app.innerHTML=this.renderSc();
    else if(this.tab_==='saved') app.innerHTML=this.renderSaved();
    else app.innerHTML=this.renderStats();
  },

  h(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');},

  // ---- PATH ----
  renderPath(){
    let html='';
    for(const ph of PATH){
      const pid=ph.id;
      const totC=ph.mods.reduce((a,m)=>a+(m.items||[]).length,0);
      const donC=ph.mods.reduce((a,m)=>a+(m.items||[]).filter((_,i)=>this.done.has(pid+'-'+m.id+'-'+i)).length,0);
      const pct=totC?Math.round(donC/totC*100):0;
      const open=this.openS.has(pid);
      html+=`<div class="sec">
        <div class="sec-hdr${open?' open':''}" data-id="${pid}" onclick="A.toggleS('${pid}')">
          <span class="sec-em">${ph.e}</span>
          <div class="sec-info">
            <div class="sec-title">${this.h(ph.t)}</div>
            <div class="sec-sub">${ph.sub}</div>
            <div class="sec-prog"><div class="pb"><div class="pf" id="pf-${pid}" style="width:${pct}%"></div></div><span class="pt" id="pt-${pid}">${donC}/${totC}</span></div>
          </div>
          <span class="sec-arr">▶</span>
        </div>
        <div class="sec-body${open?' open':''}" id="sb-${pid}">`;
      for(const mod of ph.mods){
        const mid=pid+'-'+mod.id;
        const items=mod.items||[];
        const donM=items.filter((_,i)=>this.done.has(mid+'-'+i)).length;
        const mopen=this.openM.has(mid);
        html+=`<div class="mod">
          <div class="mod-hdr${mopen?' open':''}" data-id="${this.h(mid)}" onclick="A.toggleM('${this.h(mid)}')">
            <span class="mod-title">${this.h(mod.t)}</span>
            <span class="mod-cnt" id="mc-${this.h(mid)}">${donM}/${items.length}</span>
            <span class="mod-arr">▶</span>
          </div>
          <div class="mod-items${mopen?' open':''}" id="mi-${this.h(mid)}">`;
        items.forEach((it,i)=>{
          const iid=mid+'-'+i;
          const done=this.done.has(iid);
          const book=this.bk.has(iid);
          html+=`<div class="item${done?' done':''}" data-id="${iid}">
            <div class="chk${done?' done':''}" onclick="A.toggleDone('${iid}')">${done?'✓':''}</div>
            <span class="item-t" onclick="A.openSheet('${iid}','${this.h(it)}','path')" style="cursor:pointer">${this.h(it)}</span>
            <button class="bk${book?' on':''}" onclick="A.toggleBk('${iid}','${this.h(it)}','path')" title="Bookmark">🔖</button>
            <button class="cpy" onclick="A.openSheet('${iid}','${this.h(it)}','path')" title="Copy Prompt">📋</button>
          </div>`;
        });
        html+=`</div></div>`;
      }
      html+=`</div></div>`;
    }
    return html;
  },

  // ---- DSA ----
  renderDsa(){
    const filter=this.dsaFilter;
    let html=`<div class="chips">
      <button class="chip${filter==='all'?' on':''}" onclick="A.setDsaFilter('all')">All</button>
      <button class="chip${filter==='p1'?' on':''}" onclick="A.setDsaFilter('p1')">Part 1</button>
      <button class="chip${filter==='p2'?' on':''}" onclick="A.setDsaFilter('p2')">Part 2 (Product)</button>
    </div>`;
    const topics=DSA.filter(d=>filter==='all'||(filter==='p1'&&!d.pt2)||(filter==='p2'&&d.pt2));
    for(const tp of topics){
      const tid=tp.id;
      const warmup=tp.w||[];
      const nc=tp.n||[];
      const nd=tp.nd||[];
      const prod=tp.p||[];
      const pd=tp.pd||[];
      const allIds=[
        ...warmup.map((_,i)=>tid+'-w-'+i),
        ...nc.map((_,i)=>tid+'-n-'+i),
        ...prod.map((_,i)=>tid+'-p-'+i)
      ];
      const totC=allIds.length;
      const donC=allIds.filter(id=>this.done.has(id)).length;
      const pct=totC?Math.round(donC/totC*100):0;
      const open=this.openS.has(tid);
      html+=`<div class="sec">
        <div class="sec-hdr${open?' open':''}" data-id="${tid}" onclick="A.toggleS('${tid}')">
          <span class="sec-em">${tp.e}</span>
          <div class="sec-info">
            <div class="sec-title">${tp.ord}. ${this.h(tp.t)}</div>
            <div class="sec-sub">${warmup.length} Warm-up · ${nc.length} NeetCode${prod.length?' · '+prod.length+' Product':''}</div>
            <div class="sec-prog"><div class="pb"><div class="pf" id="pf-${tid}" style="width:${pct}%"></div></div><span class="pt" id="pt-${tid}">${donC}/${totC}</span></div>
          </div>
          <span class="sec-arr">▶</span>
        </div>
        <div class="sec-body${open?' open':''}" id="sb-${tid}">`;
      if(warmup.length){
        html+=`<div class="dsa-cat">Warm-Up</div>`;
        warmup.forEach((p,i)=>{
          const iid=tid+'-w-'+i;
          const done=this.done.has(iid);
          const book=this.bk.has(iid);
          html+=`<div class="item${done?' done':''}" data-id="${iid}">
            <div class="chk${done?' done':''}" onclick="A.toggleDone('${iid}')">${done?'✓':''}</div>
            <span class="item-t" onclick="A.openSheet('${iid}','${this.h(p)}','dsa')" style="cursor:pointer">${this.h(p)}</span>
            <button class="bk${book?' on':''}" onclick="A.toggleBk('${iid}','${this.h(p)}','dsa')" title="Bookmark">🔖</button>
            <button class="cpy" onclick="A.openSheet('${iid}','${this.h(p)}','dsa')" title="Copy Prompt">📋</button>
          </div>`;
        });
      }
      if(nc.length){
        html+=`<div class="dsa-cat">NeetCode 250</div>`;
        nc.forEach((p,i)=>{
          const iid=tid+'-n-'+i;
          const done=this.done.has(iid);
          const book=this.bk.has(iid);
          const diff=nd[i]||'m';
          const dlbl=diff==='e'?'Easy':diff==='h'?'Hard':'Medium';
          const dcls=diff==='e'?'e':diff==='h'?'h':'m';
          html+=`<div class="item${done?' done':''}" data-id="${iid}">
            <div class="chk${done?' done':''}" onclick="A.toggleDone('${iid}')">${done?'✓':''}</div>
            <span class="item-t" onclick="A.openSheet('${iid}','${this.h(p)}','dsa')" style="cursor:pointer">${this.h(p)}</span>
            <span class="bdg ${dcls}">${dlbl}</span>
            <button class="bk${book?' on':''}" onclick="A.toggleBk('${iid}','${this.h(p)}','dsa')" title="Bookmark">🔖</button>
            <button class="cpy" onclick="A.openSheet('${iid}','${this.h(p)}','dsa')" title="Copy Prompt">📋</button>
          </div>`;
        });
      }
      if(prod.length){
        html+=`<div class="dsa-cat">Product Level</div>`;
        prod.forEach((p,i)=>{
          const iid=tid+'-p-'+i;
          const done=this.done.has(iid);
          const book=this.bk.has(iid);
          const diff=pd[i]||'h';
          const dlbl=diff==='e'?'Easy':diff==='h'?'Hard':'Medium';
          const dcls=diff==='e'?'e':diff==='h'?'h':'m';
          html+=`<div class="item${done?' done':''}" data-id="${iid}">
            <div class="chk${done?' done':''}" onclick="A.toggleDone('${iid}')">${done?'✓':''}</div>
            <span class="item-t" onclick="A.openSheet('${iid}','${this.h(p)}','dsa')" style="cursor:pointer">${this.h(p)}</span>
            <span class="bdg ${dcls}">${dlbl}</span>
            <button class="bk${book?' on':''}" onclick="A.toggleBk('${iid}','${this.h(p)}','dsa')" title="Bookmark">🔖</button>
            <button class="cpy" onclick="A.openSheet('${iid}','${this.h(p)}','dsa')" title="Copy Prompt">📋</button>
          </div>`;
        });
      }
      html+=`</div></div>`;
    }
    return html;
  },

  // ---- SCENARIOS ----
  renderSc(){
    let html='';
    for(const sec of SCENARIOS){
      const sid=sec.id;
      const totQ=sec.q.length;
      const donQ=sec.q.filter((_,i)=>this.done.has(sid+'-'+i)).length;
      const pct=totQ?Math.round(donQ/totQ*100):0;
      const open=this.openS.has(sid);
      html+=`<div class="sec">
        <div class="sec-hdr${open?' open':''}" data-id="${sid}" onclick="A.toggleS('${sid}')">
          <span class="sec-em">${sec.e}</span>
          <div class="sec-info">
            <div class="sec-title">${this.h(sec.t)}</div>
            <div class="sec-sub">${totQ} scenario questions</div>
            <div class="sec-prog"><div class="pb"><div class="pf" id="pf-${sid}" style="width:${pct}%"></div></div><span class="pt" id="pt-${sid}">${donQ}/${totQ}</span></div>
          </div>
          <span class="sec-arr">▶</span>
        </div>
        <div class="sec-body${open?' open':''}" id="sb-${sid}">`;
      sec.q.forEach((q,i)=>{
        const iid=sid+'-'+i;
        const done=this.done.has(iid);
        const book=this.bk.has(iid);
        html+=`<div class="sc-item${done?' done':''}" data-id="${iid}">
          <div class="chk${done?' done':''}" style="flex-shrink:0" onclick="A.toggleDone('${iid}')">${done?'✓':''}</div>
          <span class="sc-txt" onclick="A.openSheet('${iid}','${this.h(q)}','sc')" style="cursor:pointer">${this.h(q)}</span>
          <div class="sc-actions">
            <button class="bk${book?' on':''}" onclick="A.toggleBk('${iid}','${this.h(q).substring(0,80)}...','sc')" title="Bookmark">🔖</button>
            <button class="cpy" onclick="A.openSheet('${iid}','${this.h(q)}','sc')" title="Copy Prompt">📋</button>
          </div>
        </div>`;
      });
      html+=`</div></div>`;
    }
    return html;
  },

  // ---- SAVED ----
  renderSaved(){
    if(this.bk.size===0) return '<div class="empty">No bookmarks yet.<br>Tap 🔖 on any item to save it here.</div>';
    const items=[...this.bk].map(id=>{
      const data=localStorage.getItem('sb_bk_'+id);
      if(!data) return null;
      try{return{id,...JSON.parse(data)};}catch{return null;}
    }).filter(Boolean);
    if(items.length===0) return '<div class="empty">Bookmark data not found. Re-bookmark items.</div>';
    const groups={path:[],dsa:[],sc:[]};
    items.forEach(it=>{ if(groups[it.type]) groups[it.type].push(it); });
    let html='';
    const labels={path:'📍 Learning Path',dsa:'⚡ DSA Problems',sc:'🔥 Scenarios'};
    for(const[type,arr] of Object.entries(groups)){
      if(!arr.length) continue;
      html+=`<div class="sav-sec"><div class="sav-lbl">${labels[type]||type}</div>`;
      for(const it of arr){
        html+=`<div class="sav-item">
          <div style="flex:1">
            <div class="sav-t">${this.h(it.title.length>120?it.title.substring(0,120)+'...':it.title)}</div>
          </div>
          <button class="cpy" style="color:#484f58;font-size:14px" onclick="A.openSheet('${it.id}','${this.h(it.title)}','${it.type}')" title="Copy Prompt">📋</button>
          <button class="bk on" onclick="A.toggleBk('${it.id}','${this.h(it.title)}','${it.type}')" title="Remove">🔖</button>
        </div>`;
      }
      html+=`</div>`;
    }
    return html||'<div class="empty">No bookmarks yet.</div>';
  },

  // ---- STATS ----
  renderStats(){
    const pathItems=PATH.flatMap(ph=>ph.mods.flatMap((m,mi)=>(m.items||[]).map((_,i)=>ph.id+'-'+m.id+'-'+i)));
    const dsaItems=DSA.flatMap(t=>[
      ...(t.w||[]).map((_,i)=>t.id+'-w-'+i),
      ...(t.n||[]).map((_,i)=>t.id+'-n-'+i),
      ...(t.p||[]).map((_,i)=>t.id+'-p-'+i)
    ]);
    const scItems=SCENARIOS.flatMap(s=>s.q.map((_,i)=>s.id+'-'+i));
    const totPath=pathItems.length,donPath=pathItems.filter(id=>this.done.has(id)).length;
    const totDsa=dsaItems.length,donDsa=dsaItems.filter(id=>this.done.has(id)).length;
    const totSc=scItems.length,donSc=scItems.filter(id=>this.done.has(id)).length;
    const totAll=totPath+totDsa+totSc,donAll=donPath+donDsa+donSc;
    const pctAll=totAll?Math.round(donAll/totAll*100):0;
    let html=`<div class="stat-card">
      <div style="display:flex;align-items:center;gap:14px">
        <div><div class="stat-big">${pctAll}%</div><div class="stat-sub">Overall Progress</div></div>
        <div style="flex:1">
          <div class="pb" style="height:8px;margin-bottom:8px"><div class="pf" style="width:${pctAll}%;background:${pctAll<30?'#f85149':pctAll<70?'#d29922':'#3fb950'}"></div></div>
          <div style="font-size:11px;color:#8b949e">${donAll} of ${totAll} items completed</div>
        </div>
      </div>
    </div>`;
    // Per-category
    const cats=[
      {l:'🗺️ Learning Path',done:donPath,tot:totPath,c:'#58a6ff'},
      {l:'⚡ DSA Problems',done:donDsa,tot:totDsa,c:'#3fb950'},
      {l:'🔥 Scenarios',done:donSc,tot:totSc,c:'#f85149'}
    ];
    html+=`<div class="stat-card">`;
    for(const cat of cats){
      const p=cat.tot?Math.round(cat.done/cat.tot*100):0;
      html+=`<div class="prow"><span class="prow-t">${cat.l}</span><span class="prow-p">${cat.done}/${cat.tot}</span></div>
      <div class="pb" style="margin-bottom:10px;height:5px"><div class="prow-f" style="width:${p}%;background:${cat.c}"></div></div>`;
    }
    html+=`</div>`;
    // Phase breakdown
    html+=`<div class="stat-card"><div style="font-size:12px;font-weight:600;color:#8b949e;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px">Phase Breakdown</div>`;
    for(const ph of PATH){
      const pid=ph.id;
      const its=ph.mods.flatMap((m)=>(m.items||[]).map((_,i)=>pid+'-'+m.id+'-'+i));
      const tot=its.length,don=its.filter(id=>this.done.has(id)).length;
      const p=tot?Math.round(don/tot*100):0;
      html+=`<div class="prow"><span class="prow-t" style="font-size:11px">${ph.e} ${ph.t.replace('Phase ','').split('—')[0].trim()}</span><span class="prow-p">${p}%</span></div>
      <div class="pb" style="margin-bottom:8px;height:3px"><div class="prow-f" style="width:${p}%;background:#58a6ff"></div></div>`;
    }
    html+=`</div>`;
    // DSA topic breakdown
    html+=`<div class="stat-card"><div style="font-size:12px;font-weight:600;color:#8b949e;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px">DSA Topic Breakdown</div>`;
    for(const tp of DSA){
      const its=[...(tp.w||[]).map((_,i)=>tp.id+'-w-'+i),...(tp.n||[]).map((_,i)=>tp.id+'-n-'+i),...(tp.p||[]).map((_,i)=>tp.id+'-p-'+i)];
      const tot=its.length,don=its.filter(id=>this.done.has(id)).length;
      const p=tot?Math.round(don/tot*100):0;
      html+=`<div class="prow"><span class="prow-t" style="font-size:11px">${tp.e} ${tp.t}</span><span class="prow-p">${p}%</span></div>
      <div class="pb" style="margin-bottom:7px;height:3px"><div class="prow-f" style="width:${p}%;background:#3fb950"></div></div>`;
    }
    html+=`</div>`;
    // Bookmarks count
    html+=`<div class="stat-card">
      <div class="stat-row"><span class="stat-lbl">🔖 Bookmarked Items</span><span class="stat-val">${this.bk.size}</span></div>
      <div class="stat-row"><span class="stat-lbl">📋 Total Items</span><span class="stat-val">${totAll.toLocaleString()}</span></div>
      <div class="stat-row"><span class="stat-lbl">✅ Completed</span><span class="stat-val" style="color:#3fb950">${donAll.toLocaleString()}</span></div>
      <div class="stat-row"><span class="stat-lbl">⏳ Remaining</span><span class="stat-val" style="color:#d29922">${(totAll-donAll).toLocaleString()}</span></div>
    </div>`;
    return html;
  },

  // ---- SEARCH ----
  search(q){
    if(!q||!q.trim()){this.render();return;}
    const app=document.getElementById('app');
    const qlow=q.toLowerCase().trim();
    let html='';
    let count=0;
    // Search path
    for(const ph of PATH){
      for(const mod of ph.mods){
        (mod.items||[]).forEach((it,i)=>{
          if(it.toLowerCase().includes(qlow)){
            const iid=ph.id+'-'+mod.id+'-'+i;
            const done=this.done.has(iid);
            count++;
            html+=`<div class="sr"><span class="sr-tag">PATH</span><span class="sr-t${done?' done':''}">${this.h(it)}</span><button class="cpy" onclick="A.openSheet('${iid}','${this.h(it)}','path')" title="Copy Prompt">📋</button></div>`;
          }
        });
      }
    }
    // Search DSA
    for(const tp of DSA){
      const groups=[['w',tp.w||[]],['n',tp.n||[]],['p',tp.p||[]]];
      for(const[k,arr] of groups){
        arr.forEach((p,i)=>{
          if(p.toLowerCase().includes(qlow)){
            const iid=tp.id+'-'+k+'-'+i;
            const done=this.done.has(iid);
            count++;
            html+=`<div class="sr"><span class="sr-tag">DSA</span><span class="sr-t${done?' done':''}">${this.h(p)}</span><button class="cpy" onclick="A.openSheet('${iid}','${this.h(p)}','dsa')" title="Copy Prompt">📋</button></div>`;
          }
        });
      }
    }
    // Search scenarios
    for(const sec of SCENARIOS){
      sec.q.forEach((q2,i)=>{
        if(q2.toLowerCase().includes(qlow)){
          const iid=sec.id+'-'+i;
          const done=this.done.has(iid);
          count++;
          html+=`<div class="sr"><span class="sr-tag">SCENARIO</span><span class="sr-t${done?' done':''}">${this.h(q2.substring(0,120)+(q2.length>120?'...':''))}</span><button class="cpy" onclick="A.openSheet('${iid}','${this.h(q2)}','sc')" title="Copy Prompt">📋</button></div>`;
        }
      });
    }
    app.innerHTML=count?html:`<div class="no-r">No results for "${this.h(q)}"</div>`;
  },

  // ---- TOGGLE ACTIONS ----
  toggleS(id){
    if(this.openS.has(id))this.openS.delete(id);else this.openS.add(id);
    this.save();
    const hdr=document.querySelector(`.sec-hdr[data-id="${id}"]`);
    const body=document.getElementById('sb-'+id);
    if(hdr&&body){hdr.classList.toggle('open');body.classList.toggle('open');}
  },
  toggleM(id){
    if(this.openM.has(id))this.openM.delete(id);else this.openM.add(id);
    this.save();
    const hdr=document.querySelector(`.mod-hdr[data-id="${id}"]`);
    const items=document.getElementById('mi-'+id);
    if(hdr&&items){hdr.classList.toggle('open');items.classList.toggle('open');}
  },
  toggleDone(id){
    const wasDone=this.done.has(id);
    if(wasDone)this.done.delete(id);else this.done.add(id);
    this.save();
    // Update the item element
    const el=document.querySelector(`[data-id="${id}"]`);
    if(el){
      el.classList.toggle('done',!wasDone);
      const chk=el.querySelector('.chk');
      if(chk){chk.classList.toggle('done',!wasDone);chk.textContent=wasDone?'':'✓';}
    }
    // Update progress bar for the section this item belongs to
    this._updateSectionProgress(id);
  },
  _updateSectionProgress(itemId){
    // Determine section id from item id
    // Path items: pid-p1m0-idx, DSA: tid-w/n/p-idx, Scenario: sid-idx
    // Find section id by looking at which section contains this item
    // Try path: pid = first segment
    const parts=itemId.split('-');
    // Try section ids
    const tryIds=[
      parts[0],                          // e.g. p1, d1, s1
      parts[0]+'-'+parts[1]              // e.g. p1-p1m0
    ];
    for(const sid of tryIds){
      const pf=document.getElementById('pf-'+sid);
      const pt=document.getElementById('pt-'+sid);
      if(pf&&pt){
        // Count done vs total for this section
        const items=document.querySelectorAll(`#sb-${sid} [data-id]`);
        if(items.length){
          let don=0;
          items.forEach(it=>{if(this.done.has(it.dataset.id))don++;});
          const pct=Math.round(don/items.length*100);
          pf.style.width=pct+'%';
          pt.textContent=don+'/'+items.length;
        }
        // Also update module count if applicable
        const mc=document.getElementById('mc-'+sid);
        if(mc){
          const mitems=document.querySelectorAll(`#mi-${sid} [data-id]`);
          if(mitems.length){
            let dmc=0;
            mitems.forEach(it=>{if(this.done.has(it.dataset.id))dmc++;});
            mc.textContent=dmc+'/'+mitems.length;
          }
        }
      }
    }
    // Update module count for path items (mid = parts[0]+'-'+parts[1]+'-'+parts[2] without last part)
    if(parts.length>=3){
      const mid=parts.slice(0,-1).join('-');
      const mc=document.getElementById('mc-'+mid);
      if(mc){
        const mitems=document.querySelectorAll(`#mi-${mid} [data-id]`);
        if(mitems.length){
          let dmc=0;
          mitems.forEach(it=>{if(this.done.has(it.dataset.id))dmc++;});
          mc.textContent=dmc+'/'+mitems.length;
        }
      }
    }
  },
  toggleBk(id,title,type){
    if(this.bk.has(id)){
      this.bk.delete(id);
      localStorage.removeItem('sb_bk_'+id);
    } else {
      this.bk.add(id);
      try{localStorage.setItem('sb_bk_'+id,JSON.stringify({title,type}));}catch(e){}
    }
    this.save();
    // Update bookmark button appearance without re-render
    const el=document.querySelector(`[data-id="${id}"]`);
    if(el){const bk=el.querySelector('.bk');if(bk)bk.classList.toggle('on',this.bk.has(id));}
  },
  setDsaFilter(f){
    this.dsaFilter=f;this.render();
  },

  // ---- PROMPT SHEET ----
  openSheet(id,title,type){
    this.curSheet={id,title,type};
    document.getElementById('shT').textContent=title.length>100?title.substring(0,100)+'...':title;
    document.getElementById('shS').textContent=type==='path'?'Learning Path Concept':type==='dsa'?'DSA Problem':'Scenario Question';
    const container=document.getElementById('shP');
    container.innerHTML=PMTS.map((p,i)=>`
      <button class="pmt-btn" onclick="A.copyPrompt(${i},'${title.replace(/'/g,"\\'")}')">
        <span class="pmt-ic">${p.e}</span>
        <div>
          <div class="pmt-lbl">${p.l}</div>
          <div class="pmt-dsc">${p.d}</div>
        </div>
      </button>`).join('');
    document.getElementById('overlay').classList.add('show');
    document.body.style.overflow='hidden';
  },
  closeSheet(e){
    if(e&&e.target!==document.getElementById('overlay'))return;
    document.getElementById('overlay').classList.remove('show');
    document.body.style.overflow='';
    this.curSheet=null;
  },
  async copyPrompt(pidx,topic){
    const p=PMTS[pidx];
    const text=p.t.replace(/\{\{T\}\}/g,topic);
    try{
      await navigator.clipboard.writeText(text);
      this.toast('✓ Copied!');
    }catch(e){
      // Fallback
      const ta=document.createElement('textarea');
      ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.focus();ta.select();
      try{document.execCommand('copy');this.toast('✓ Copied!');}catch(e2){this.toast('⚠ Copy failed');}
      document.body.removeChild(ta);
    }
    this.closeSheet();
  },
  toast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
  }
};

// ============================================================
// PWA — inline service worker + manifest
// ============================================================
(function(){
  // Manifest via data URI
  const manifest={
    name:'SB Interview Tracker',
    short_name:'SB Tracker',
    description:'Java Spring Boot Interview Prep Tracker',
    start_url:'.',
    display:'standalone',
    background_color:'#0d1117',
    theme_color:'#0d1117',
    icons:[{src:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%230d1117"/><text y=".9em" font-size="80" x="10">☕</text></svg>',sizes:'any',type:'image/svg+xml'}]
  };
  const ml=document.createElement('link');
  ml.rel='manifest';
  ml.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(ml);

  // Service Worker
  if('serviceWorker' in navigator){
    const sw=`
const C='sb-v1';
self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.add('/'))));
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
    if(res.status===200){const c=res.clone();caches.open(C).then(ch=>ch.put(e.request,c));}
    return res;
  }).catch(()=>caches.match('/'))));
});
self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k))))));
    `;
    const blob=new Blob([sw],{type:'application/javascript'});
    const url=URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(()=>{});
  }
})();

// Start app
A.init();
</script>
